name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: kivy/buildozer-action@v1
        with:
          filename: buildozer.spec
          command: |
            buildozer init
            sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,pygame,speech_recognition/g' buildozer.spec
            sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET,RECORD_AUDIO/g' buildozer.spec
            sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
            sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
            buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberNeon-APK
          path: bin/*.apk
