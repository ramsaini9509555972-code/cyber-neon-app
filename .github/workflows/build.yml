name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-good \
          gstreamer1.0-alsa \
          unzip \
          zip \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libltdl-dev \
          libffi-dev \
          libssl-dev \
          patch

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.33
        pip install buildozer

    - name: Ensure NDK clang is used & Clean previous builds
      run: |
        # Location buildozer installs the NDK to
        ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r28c"

        # Persist NDK path so buildozer/python-for-android sees it
        echo "ANDROIDNDK=$ANDROIDNDK" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROIDNDK" >> $GITHUB_ENV

        # Use NDK clang wrappers as default compiler for all steps
        echo "CC=$ANDROIDNDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> $GITHUB_ENV
        echo "CXX=$ANDROIDNDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" >> $GITHUB_ENV

        # Prepend NDK clang bin to PATH so toolchain binaries are found first
        echo "PATH=$ANDROIDNDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV

        # Force the compiler to use the NDK sysroot (prevents falling back to host /usr/include)
        SYSROOT="$ANDROIDNDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        echo "CFLAGS=--sysroot=$SYSROOT -isystem $SYSROOT/usr/include" >> $GITHUB_ENV
        echo "CXXFLAGS=--sysroot=$SYSROOT -isystem $SYSROOT/usr/include" >> $GITHUB_ENV
        echo "LDFLAGS=--sysroot=$SYSROOT" >> $GITHUB_ENV

        # Clean cached build artifacts to avoid stale mixed headers
        rm -rf .buildozer android/.buildozer .p4a .gradle

    - name: Generate Buildozer Spec
      run: |
        if [ ! -f "buildozer.spec" ]; then
          yes | buildozer init
        fi

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CyberNeon-APK
        path: bin/*.apk
