name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-good \
          gstreamer1.0-alsa \
          unzip \
          zip \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libltdl-dev \
          libffi-dev \
          libssl-dev \
          patch

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.33
        pip install buildozer

    - name: Ensure NDK path is set & Clean previous builds
      run: |
        # Location buildozer installs the NDK to
        ANDROIDNDK="$HOME/.buildozer/android/platform/android-ndk-r28c"

        # Persist NDK path so buildozer/python-for-android sees it
        echo "ANDROIDNDK=$ANDROIDNDK" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROIDNDK" >> $GITHUB_ENV

        # Clean cached build artifacts to avoid stale mixed headers
        rm -rf .buildozer android/.buildozer .p4a .gradle

    - name: Generate Buildozer Spec
      run: |
        if [ ! -f "buildozer.spec" ]; then
          yes | buildozer init
        fi

    - name: Build APK with Buildozer
      run: |
        # Force configure caches for cross-compilation (avoid compile-and-run tests)
        export ac_cv_sizeof_off_t=8
        export ac_cv_func_localtime_s=no
        export ac_cv_func_localtime_r=yes
        
        # Pretend deflate and zlib are available so checks succeed
        export ac_cv_func_deflate=yes
        export ac_cv_lib_z=z
        
        # Ensure 64-bit file offsets and link with math/zlib for configure/linker tests
        export CFLAGS="-D_FILE_OFFSET_BITS=64"
        export LDFLAGS="-lm -lz"
        
        # Run buildozer
        yes | buildozer -v android debug

    - name: Dump any config.log files for debugging
      if: failure()
      run: |
        find . -type f -name config.log -print -exec echo "=== {} ===" \; -exec sed -n '1,200p' {} \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CyberNeon-APK
        path: bin/*.apk
