name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-good \
          gstreamer1.0-alsa \
          unzip \
          zip \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libltdl-dev \
          libffi-dev \
          libssl-dev \
          clang

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.33
        pip install buildozer

    - name: Install Android NDK r21e and export environment
      run: |
        mkdir -p ~/.buildozer/android/platform
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip -O /tmp/android-ndk-r21e.zip
        unzip -q /tmp/android-ndk-r21e.zip -d ~/.buildozer/android/platform
        echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r21e" >> $GITHUB_ENV
        echo "ANDROIDNDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r21e" >> $GITHUB_ENV
        echo "ANDROIDAPI=33" >> $GITHUB_ENV
        echo "ANDROIDMINAPI=24" >> $GITHUB_ENV

    - name: Install Android SDK command-line tools and build-tools
      run: |
        set -e
        SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_ROOT"

        CMDLINE_ZIP="/tmp/cmdline-tools.zip"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O "$CMDLINE_ZIP"
        unzip -q "$CMDLINE_ZIP" -d "$SDK_ROOT"

        mkdir -p "$SDK_ROOT/cmdline-tools/latest"
        # Move files safely avoiding moving latest into itself
        for f in "$SDK_ROOT/cmdline-tools/"*; do
          if [ "$(basename "$f")" != "latest" ]; then
            mv "$f" "$SDK_ROOT/cmdline-tools/latest/"
          fi
        done

        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROIDSDK=$SDK_ROOT" >> $GITHUB_ENV

        echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

        export ANDROID_SDK_ROOT="$SDK_ROOT"
        yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses

    - name: Generate Buildozer Spec
      run: |
        if [ ! -f "buildozer.spec" ]; then
          yes | buildozer init
        fi

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CyberNeon-APK
        path: bin/*.apk
