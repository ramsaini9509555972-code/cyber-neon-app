name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        platforms: android-33
        build-tools: 33.0.2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          gstreamer1.0-plugins-good \
          gstreamer1.0-alsa \
          unzip \
          zip \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libltdl-dev \
          libstdc++6 \
          libz1

    - name: Install Python For Android & Cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.33
        pip install python-for-android

    - name: Build APK using PFA Directly
      env:
        ANDROIDSDK: ${{ env.ANDROID_HOME }}
        ANDROIDAPI: "33"
        ANDROIDSIGN: "debug"
      run: |
        p4a create --requirements=python3,kivy,pygame,speech_recognition \
          --package=org.cyberneon.app \
          --name="Cyber Neon" \
          --version=0.1 \
          --bootstrap=sdl2 \
          --target=apk \
          --arch=arm64-v8a

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CyberNeon-APK
        path: "*.apk"
